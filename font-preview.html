<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>서체 비교 시안</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap">
  <link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400..800&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=20261114b">
  <link rel="stylesheet" href="assets/cheer.css?v=20261114b">
  <script>document.documentElement.classList.add("js")</script>
</head>
<body data-page="home">
  <div class="font-bar" role="group" aria-label="서체 조합 고르기">
    <span class="font-bar-label">서체 비교 시안</span>
    <button type="button" data-combo="1" aria-pressed="true"><b>1</b> 단정하게</button>
    <button type="button" data-combo="2" aria-pressed="false"><b>2</b> 에디토리얼</button>
    <button type="button" data-combo="3" aria-pressed="false"><b>3</b> 모던 브랜드</button>
    <p class="font-bar-desc" data-combo-desc></p>
  </div>
  <section class="hero" id="hero"></section>
  <main>
    <section class="quick container" aria-label="바로가기" data-reveal>
      <ul class="quick-grid" data-menu-grid></ul>
    </section>
    <section class="section container" aria-labelledby="cheer-title" data-reveal>
      <div class="section-head">
        <div><p class="kicker">Cheer board</p><h2 id="cheer-title">응원 보드</h2></div>
        <a class="more-link" href="board.html">전체 보기<span data-ico="arrow-right"></span></a>
      </div>
      <div class="cheer-intro">
        <p>함께 준비하는 분들께 짧은 응원을 남겨 주세요.<br>이름 대신 별명으로 붙어요.</p>
        <button class="btn" type="button" data-cheer-write><span data-ico="plus"></span>응원 붙이기</button>
      </div>
      <div class="cheer-board"><div class="cheer-cork">
        <ul class="cheer-grid" data-cheer data-limit="8"></ul>
      </div></div>
    </section>
    <section class="section container" aria-labelledby="recent-title" data-reveal>
      <div class="section-head">
        <div><p class="kicker">Notice</p><h2 id="recent-title">최근 공지</h2></div>
        <a class="more-link" href="notices.html">전체 보기<span data-ico="arrow-right"></span></a>
      </div>
      <div data-list></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/config.js?v=20261114b"></script>
  <script src="assets/defaults.js?v=20261114b"></script>
  <script src="assets/site.js?v=20261114b"></script>
  <script src="assets/pages.js?v=20261114b"></script>
  <script src="assets/cheer.js?v=20261114b"></script>
  <style>
    .font-bar { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 60; transform: translateX(-50%); width: min(560px, calc(100vw - 24px)); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px 12px; border-radius: 20px; background: rgba(28, 26, 23, .92); color: #fff; box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); font-family: "Pretendard Variable", sans-serif; }
    @media (min-width: 900px) { .font-bar { bottom: 24px; } }
    .font-bar-label { width: 100%; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: rgba(255, 255, 255, .6); margin: 0 0 2px 4px; }
    .font-bar button { flex: 1; min-height: 40px; border: 0; border-radius: 12px; background: rgba(255, 255, 255, .08); color: #fff; font: 600 14px "Pretendard Variable", sans-serif; cursor: pointer; white-space: nowrap; }
    .font-bar button b { color: #fbba00; margin-right: 4px; }
    .font-bar button[aria-pressed="true"] { background: #fff; color: #1c1a17; }
    .font-bar-desc { width: 100%; margin: 6px 4px 0; font-size: 12.5px; line-height: 1.5; color: rgba(255, 255, 255, .72); }
  </style>
  <script>
    // 시안 전용: 서체 조합 바꿔 보기
    const COMBOS = {
      1: { desc: "프리텐다드 하나로 통일. 지금 사이트와 같아요.", vars: {} },
      2: { desc: "큰 제목은 마루 부리(명조), 본문은 프리텐다드, 영문 라벨은 Instrument Serif.", vars: {
        "--font-head": '"MaruBuriBold", "MaruBuri", serif', "--head-weight": "400", "--head-tracking": "-0.03em",
        "--font-kicker": '"Instrument Serif", serif', "--kicker-case": "none", "--kicker-size": "19px",
        "--kicker-tracking": "0", "--kicker-style": "italic", "--kicker-weight": "400" } },
      3: { desc: "본문·제목은 SUIT, 영문과 숫자는 Manrope.", vars: {
        "--font": '"Manrope", "SUIT Variable", system-ui, sans-serif', "--font-head": '"Manrope", "SUIT Variable", sans-serif',
        "--head-weight": "800", "--head-tracking": "-0.04em", "--font-kicker": '"Manrope", sans-serif', "--kicker-tracking": ".14em",
        "--font-num": '"Manrope", sans-serif' } },
    };
    const ALL = [...new Set(Object.values(COMBOS).flatMap((c) => Object.keys(c.vars)))];
    function pick(n) {
      const root = document.documentElement;
      ALL.forEach((k) => root.style.removeProperty(k));
      Object.entries(COMBOS[n].vars).forEach(([k, v]) => root.style.setProperty(k, v));
      document.querySelectorAll("[data-combo]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.combo === String(n)));
      document.querySelector("[data-combo-desc]").textContent = COMBOS[n].desc;
    }
    document.querySelectorAll("[data-combo]").forEach((b) => b.onclick = () => pick(b.dataset.combo));
    pick(new URLSearchParams(location.search).get("c") || 1);
  </script>
</body>
</html>
