<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>채용정보</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=20261114o">
  <script>document.documentElement.classList.add("js")</script>
</head>
<body data-page="jobs">
  <div class="page-head" id="page-head"></div>
  <main class="container page-body">
    <div data-jobs><div class="list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/config.js?v=20261114o"></script>
  <script src="assets/defaults.js?v=20261114o"></script>
  <script src="assets/site.js?v=20261114o"></script>
  <script src="assets/jobparse.js?v=20261114o"></script>
  <script src="assets/jobs.js?v=20261114o"></script>
  <script>
    (async function () {
      const box = document.querySelector("[data-jobs]");
      const toast = (msg) => {
        let t = document.querySelector(".toast");
        if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.append(t); }
        t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
      };
      const none = (title, text) => `<div class="list"><div class="empty">${ico("briefcase")}<strong>${title}</strong><p>${text}</p></div></div>`;
      if (!window.db) { box.innerHTML = none("준비 중이에요", "곧 공고가 올라와요."); return; }
      const { data, error } = await db.from("jobs").select("*").order("deadline", { ascending: true });
      if (error) { console.error(error); box.innerHTML = none("준비 중이에요", "곧 공고가 올라와요."); return; }
      if (!data.length) { box.innerHTML = none("지금 올라온 공고가 없어요", "새 공고가 올라오면 여기에서 바로 볼 수 있어요."); return; }
      renderJobs(box, data, { toast });
    })();
  </script>
</body>
</html>
