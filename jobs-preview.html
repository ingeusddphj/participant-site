<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f6f3">
  <title>채용정보 시안</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=20261114i">
  <script>document.documentElement.classList.add("js")</script>
</head>
<body data-page="jobs-preview">
  <div class="page-head">
    <div class="container">
      <p class="crumbs"><a href="index.html">홈</a><span data-ico="chevron-right"></span><span>채용정보 (시안)</span></p>
      <h1>채용정보</h1>
      <p>직무·경력·지역별 공고. 아래는 예시 공고예요.</p>
    </div>
  </div>
  <main class="container page-body">
    <details class="panel try-box" open>
      <summary><span><b>자동 입력 시험</b> · 시안 전용</span><span class="hint">카톡으로 보내시던 문구를 그대로 붙여넣어 보세요</span></summary>
      <div class="panel-body">
        <textarea id="try" rows="4" placeholder="https://...&#10;삼성전자/인사노무/신입/서울/대졸/1210"></textarea>
        <div class="row" style="margin-top:10px"><button class="btn btn-dark" type="button" id="try-go">읽어서 목록에 추가</button><span class="hint" id="try-msg"></span></div>
        <div id="try-out"></div>
      </div>
    </details>
    <div id="jobs"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/config.js?v=20261114i"></script>
  <script src="assets/defaults.js?v=20261114i"></script>
  <script src="assets/site.js?v=20261114i"></script>
  <script src="assets/jobparse.js?v=20261114i"></script>
  <script src="assets/jobs.js?v=20261114i"></script>
  <script>
    // 시안 전용: 예시 공고는 상담사님 카톡 형식 그대로 적고, 자동 입력으로 읽어 들임
    const SAMPLE = `https://www.samsungcareers.com/
삼성전자/인사노무/신입/서울/대졸/1210
https://www.hanwhain.com/
한화에어로스페이스/R&D/신입/경기 성남/석사/오픽IM2/0110
https://www.work24.go.kr/
서울교통공사/사무행정/인턴 6개월/신입/서울 성동구/고졸/1130
https://www.work24.go.kr/
쿠팡풀필먼트서비스/물류 운영관리/계약직 12개월/무관/경기 평택/학력무관/지게차 자격 우대/상시
https://www.work24.go.kr/
한국보건산업진흥원/연구행정/계약직 10개월/경력 2년/충북 청주/대졸/1117
https://www.work24.go.kr/
○○코리아/품질관리/경력 3년/경기 화성/대졸/영어 회화 가능/1205
https://www.work24.go.kr/
△△물산/사무보조/신입/서울 동대문구/고졸/MOS 우대/1121`;
    const now = Date.now();
    const jobs = parseJobText(SAMPLE).map((j, i) => Object.assign(j, { created_at: new Date(now - [1, 5, 2, 9, 0.5, 12, 1][i] * 864e5).toISOString() }));
    jobs[1].category = "대기업"; jobs[3].category = "대기업"; jobs[5].category = "외국계"; jobs[6].category = "강소·중소";

    function toast(msg) {
      let t = document.querySelector(".toast");
      if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.append(t); }
      t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
    }
    const view = renderJobs(document.getElementById("jobs"), jobs, { toast });

    const label = { company: "기업명", role: "직무", category: "기업 범주(추정)", employment: "고용형태", months: "기간(개월)", career: "경력", education: "학력", region: "지역", area: "지역 구분", etc: "기타 자격요건", deadline: "마감일", rolling: "상시", recommend: "인재추천", link: "링크" };
    document.getElementById("try-go").onclick = () => {
      const got = parseJobText(document.getElementById("try").value);
      const msg = document.getElementById("try-msg");
      if (!got.length) { msg.textContent = "읽을 수 있는 공고가 없어요. '기업명/직무/...' 처럼 / 로 나눠 주세요."; return; }
      got.forEach((j) => { j.created_at = new Date().toISOString(); jobs.push(j); });
      msg.textContent = `${got.length}개를 읽었어요. 아래 목록에도 추가했어요.`;
      document.getElementById("try-out").innerHTML = got.map((j) => `<dl class="try-dl">${Object.entries(label).map(([k, l]) => {
        let v = j[k];
        if (k === "recommend") v = v ? "가능" : "불가";
        if (k === "rolling") v = v ? "예" : "";
        return v === "" || v === null || v === undefined ? "" : `<div><dt>${l}</dt><dd>${esc(String(v))}</dd></div>`;
      }).join("")}</dl>`).join("");
      view.redraw();
    };
  </script>
</body>
</html>
