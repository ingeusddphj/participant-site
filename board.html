<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>응원 보드</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/cheer.css">
  <script>document.documentElement.classList.add("js")</script>
</head>
<body data-page="board">
  <div class="page-head" id="page-head"></div>
  <main class="container page-body">
    <div class="cheer-intro">
      <p>함께 준비하는 분들께 짧은 응원을 남겨 주세요.<br>이름 대신 별명으로 붙어요.</p>
      <button class="btn" type="button" data-cheer-write><span data-ico="plus"></span>응원 붙이기</button>
    </div>
    <div class="cheer-board"><div class="cheer-cork">
      <ul class="cheer-grid" data-cheer data-paged data-limit="24"></ul>
      <div class="cheer-more"><button class="btn btn-secondary" type="button" data-cheer-more hidden>응원 더 보기</button></div>
    </div></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/defaults.js"></script>
  <script src="assets/site.js"></script>
  <script src="assets/cheer.js"></script>
</body>
</html>
