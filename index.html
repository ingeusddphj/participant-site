<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>취업 준비 함께해요</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=20261114b">
  <link rel="stylesheet" href="assets/cheer.css?v=20261114b">
  <script>document.documentElement.classList.add("js")</script>
</head>
<body data-page="home">
  <section class="hero" id="hero"></section>
  <main>
    <section class="quick container" aria-label="바로가기" data-reveal>
      <ul class="quick-grid" data-menu-grid></ul>
    </section>
    <section class="section container" aria-labelledby="cheer-title" data-reveal>
      <div class="section-head">
        <div><p class="kicker">Cheer board</p><h2 id="cheer-title">응원 보드</h2></div>
        <a class="more-link" href="board.html">전체 보기<span data-ico="arrow-right"></span></a>
      </div>
      <div class="cheer-intro">
        <p>함께 준비하는 분들께 짧은 응원을 남겨 주세요.<br>이름 대신 별명으로 붙어요.</p>
        <button class="btn" type="button" data-cheer-write><span data-ico="plus"></span>응원 붙이기</button>
      </div>
      <div class="cheer-board"><div class="cheer-cork">
        <ul class="cheer-grid" data-cheer data-limit="8"></ul>
      </div></div>
    </section>
    <section class="section container" aria-labelledby="recent-title" data-reveal>
      <div class="section-head">
        <div><p class="kicker">Notice</p><h2 id="recent-title">최근 공지</h2></div>
        <a class="more-link" href="notices.html">전체 보기<span data-ico="arrow-right"></span></a>
      </div>
      <div data-list></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/config.js?v=20261114b"></script>
  <script src="assets/defaults.js?v=20261114b"></script>
  <script src="assets/site.js?v=20261114b"></script>
  <script src="assets/pages.js?v=20261114b"></script>
  <script src="assets/cheer.js?v=20261114b"></script>
</body>
</html>
